name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "1.23", "1.24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      # Coverage profile: coverage.out. Note: the Sonar check on this repo is
      # SonarCloud Automatic Analysis, which does not support coverage import;
      # passing sonar.go.coverage.reportPaths will take effect once the
      # project switches to CI-based analysis (sonar.yml + SONAR_TOKEN secret).
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found files needing formatting:"
            echo "$out"
            exit 1
          fi
